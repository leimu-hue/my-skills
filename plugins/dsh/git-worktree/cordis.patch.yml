# Git Worktree: one Host row.
#
# `dshHome` only pins the DSH home indirection so state (registry, and the
# checkouts of `layout: state`) follows the profile instead of a hard-coded
# `~/.dsh`.
#
# Everything below is optional and mirrors the plugin defaults; uncomment to
# change them:
#
#   layout: repo                 # repo = <repository>/.worktrees/ ; state = $DSH_HOME
#   worktreeDir: .worktrees      # directory name used by the repo layout
#   basePolicy: fresh            # fresh = origin/<default branch>; head = main HEAD
#   mode: branch                 # branch = worktree/<name>; detached = disposable
#   setupCommands: []            # e.g. ['npm install']
#   verifyCommand: npm test      # baseline self-check, opt-in
#   autoRegisterWorkspace: true  # register the checkout as a sidebar workspace
#   autoSession: true            # start a session whose cwd is the checkout
- insert:
    - id: git-worktree
      name: '@local/dsh-git-worktree'
      config:
        dshHome: !!js dshHomePath('')
